# Any value can be overridden on the command line, e.g. -Dheadless=true
base.url=https://www.saucedemo.com/
username=standard_user
password=secret_sauce

# Products priced below this are filtered out
price.threshold=15.00

# Explicit wait timeout in seconds
wait.seconds=15

# Checkout form data
checkout.firstName=Test
checkout.lastName=User
checkout.postalCode=560001

# Run browsers without a window (use true on Jenkins)
headless=false
